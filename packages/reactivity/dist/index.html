<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="app"></div>
<!-- 
    <script type="module"> 是 HTML5 中引入的一种脚本类型，它告诉浏览器：
    把这段脚本当作 ES 模块（ECMAScript Module）来对待。
    简单理解：它是官方原生支持的、可以在浏览器里直接使用 import 和 export 的方式。 
-->
    <script type="module">
        // import { reactive, effect } from "/node_modules/@vue/reactivity/dist/reactivity.esm-browser.js"
        import { reactive, effect, toRef, ref, watch } from "./reactivity.js"
        let obj = { name: 'plz', age: 22, flag: true };
        // 静态对象转响应式对象
        const state1 = reactive(obj);
        const name = toRef(state1, "name");
        // 代理后数据再代理，此时state1已有get和set，所以可以在get中添加访问逻辑，做区分的同时不污染原数据
        // const state2 = reactive(state1);
        const unwatch = watch(
            state1,
            (newValue, oldValue) => {
                console.log(newValue, oldValue);
            },
            {
                deep: true,
                immediate: true
            }
        ) 
        // unwatch();
        setTimeout(() => {
            state1.flag = false;
        }, 1000);
    </script>
</body>
</html>
