<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      // import { render, h, Fragment } from "/node_modules/@vue/runtime-dom/dist/runtime-dom.esm-browser.js";
      import { render, h, Fragment, Text } from "./runtime-dom.js";
      const app = document.getElementById("app");

      const VueComponent2 = {
        props: {
          address: String,
        },
        render(proxy) {
          return h(Fragment, [h(Text, proxy.address)]);
        },
      };

      const VueComponent = {
        data() {
          return { flag: true };
        },
        render() {
          return h(Fragment, [
            h(
              "button",
              {
                onClick: () => (this.flag = !this.flag),
              },
              "切换",
            ),
            h(VueComponent2, { address: this.flag ? "上海" : "北京" }),
          ]);
        },
      };

      render(h(VueComponent), app);
    </script>
  </body>
</html>
