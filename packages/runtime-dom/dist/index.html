<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      // import { render, h, Fragment } from "/node_modules/@vue/runtime-dom/dist/runtime-dom.esm-browser.js";
      import { render, h, Fragment } from "./runtime-dom.js";

      const app = document.getElementById("app");
      const VueComponent = {
        data() {
          return {
            name: "plz",
            age: 22,
          };
        },
        render() {
          // 模拟依赖更新
          setTimeout(() => {
            this.age++;
          }, 1000);
          // this == 组件的实例，内部不会通过类来产生实例
          return h(Fragment,[
            h("p", `name: ${this.name}`),
            h("p", `age: ${this.age}`),
          ]);
        },
      }
      // 组件由两个虚拟节点组成 h(VueComponent) = vnode 产生的是组件内的虚拟节点
      // render函数返回的虚拟节点，这个虚拟节点才是最终要渲染的内容 = sunTree
      // 从实现上理解，如果h传如的是对象，那就是要渲染自定义组件
      render(h(VueComponent), app);
    </script>
  </body>
</html>
