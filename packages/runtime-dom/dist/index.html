<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      // import { render, h, Fragment } from "/node_modules/@vue/runtime-dom/dist/runtime-dom.esm-browser.js";
      import { render, h, Fragment, Text, ref } from "./runtime-dom.js";
      const app = document.getElementById("app");

      const VueComponent2 = {
        props: {
          address: String,
        },
        render(proxy) {
          return h(Fragment, [h(Text, proxy.address)]);
        },
      };

      const VueComponent = {
        setup(props, {emit, attrs, expose, slots}) {
          const a = ref(1);
          setTimeout(() => {
            a.value = 2;
          }, 1000);
          return { a } // setup可以返回函数，也还可以返回对象
        },
        render(proxy) {
          return h("div", proxy.a);
        },
      };

      render(h(VueComponent), app);
    </script>
  </body>
</html>
